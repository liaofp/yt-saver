name: YouTube-Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        required: true
      download_type:
        default: 'audio'
        type: choice
        options: [video, audio]
      storage_provider:
        default: 'aliyun'
      provider_token:
        description: 'Aliyun Drive Refresh Token'
        required: false
      ali_path:
        description: 'Aliyun Drive storage path'
        default: '/'
        required: false
      output_filename:
        description: 'Custom output filename (pure name, no extension)'
        default: ''
        required: false
      cookies_b64:
        description: 'Base64-encoded cookies.txt (auto-filled by youtube.py)'
        default: ''
        required: false

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner

    steps:
      - name: 1. Checkout code & strengthen environment
        uses: actions/checkout@v4

      - name: 2. Install dependencies (force-update yt-dlp + PO Token provider)
        run: |
          # Force-reinstall latest nightly yt-dlp from master to handle recent YouTube changes
          sudo python3 -m pip install -U yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg nodejs jq git
          sudo yt-dlp --update || true
          # Install bgutil-ytdlp-pot-provider plugin for automatic per-video PO Token generation
          # This is the yt-dlp-recommended way to handle PO Tokens since YouTube binds them to video ID
          sudo python3 -m pip install -U bgutil-ytdlp-pot-provider
          # Clone and build the provider server code (required for script-mode PO Token generation)
          # The plugin looks for it at ~/bgutil-ytdlp-pot-provider by default
          git clone --single-branch --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git ~/bgutil-ytdlp-pot-provider
          cd ~/bgutil-ytdlp-pot-provider/server
          npm ci
          npx tsc

      - name: 2b. Start bgutil PO Token provider server
        run: |
          # Start the HTTP server in the background so yt-dlp can reach it at 127.0.0.1:4416
          nohup node ~/bgutil-ytdlp-pot-provider/server/build/main.js > /tmp/bgutil-server.log 2>&1 &
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4416/ping > /dev/null 2>&1; then
              echo "[*] bgutil PO Token provider server is ready on port 4416"
              break
            fi
            echo "[*] Waiting for bgutil server to start... ($i/30)"
            sleep 1
          done
          # Print server log for debugging if it failed to start
          if ! curl -s http://127.0.0.1:4416/ping > /dev/null 2>&1; then
            echo "[!] Warning: bgutil server may not be fully ready. Log:"
            cat /tmp/bgutil-server.log || true
          fi

      - name: 3. Execute decryption download
        run: |
          COOKIES_B64="${{ github.event.inputs.cookies_b64 }}"
          if [ -z "$COOKIES_B64" ]; then
            echo "❌ Error: cookies_b64 input is empty."
            echo "Please run 'python3 youtube.py' locally to trigger the workflow."
            echo "---RESULT_START---"
            echo "STATUS: FAILED"
            echo "REASON: cookies_b64 input is empty. Run 'python3 youtube.py' to trigger."
            echo "---RESULT_END---"
            exit 1
          fi
          if ! echo "$COOKIES_B64" | base64 -d > cookies.txt 2>/dev/null; then
            echo "❌ Error: Failed to decode cookies_b64."
            echo "---RESULT_START---"
            echo "STATUS: FAILED"
            echo "REASON: Failed to decode cookies_b64."
            echo "---RESULT_END---"
            exit 1
          fi

          # yt-dlp args: use web_embedded client (tv_downgraded is broken since Aug 2026
          # due to YouTube's new TVHTML5 JS changes - see yt-dlp#17389)
          # bgutil plugin generates per-video PO Tokens (YouTube now binds them to video ID - see yt-dlp#17404)
          BASE_ARGS=(
            --rm-cache-dir
            --cookies cookies.txt
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
            --add-header "Accept-Language:en-US,en;q=0.9"
            --js-runtimes node
            --no-check-certificates
            --retries 10
            --fragment-retries 10
            --extractor-retries 3
            --file-access-retries 3
            --retry-sleep fragment:exp=2:10
            --force-ipv4
            --geo-bypass
            --buffer-size 16K
            --http-chunk-size 10M
            --extractor-args "youtube:player_client=default,web_embedded;pot_provider=bgutil"
            --verbose
          )
          BASE_ARGS+=(--use-extractors "youtube")

          # Generate timestamp first so the same value is used before and after download
          TIMESTAMP_MS=$(date +%s%3N)

          # Determine whether a custom filename is used
          if [ -n "${{ github.event.inputs.output_filename }}" ]; then
            # User specified a filename: use it directly without appending timestamp;
            # yt-dlp will append the correct extension automatically
            OUTPUT_TEMPLATE="${{ github.event.inputs.output_filename }}.%(ext)s"
            FILE_PREFIX="${{ github.event.inputs.output_filename }}"
          else
            # No filename specified: use timestamp as filename
            OUTPUT_TEMPLATE="${TIMESTAMP_MS}.%(ext)s"
            FILE_PREFIX="${TIMESTAMP_MS}"
          fi

          YTDLP_ERR_LOG="/tmp/yt-dlp-error.log"
          YTDLP_EXIT_CODE=0
          if [ "${{ github.event.inputs.download_type }}" = "audio" ]; then
            yt-dlp "${BASE_ARGS[@]}" -f "bestaudio[ext=webm]/bestaudio[ext=m4a]/bestaudio" --extract-audio --audio-format opus "${{ github.event.inputs.video_url }}" -o "$OUTPUT_TEMPLATE" 2>"$YTDLP_ERR_LOG" || YTDLP_EXIT_CODE=$?
          else
            yt-dlp "${BASE_ARGS[@]}" -f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]" "${{ github.event.inputs.video_url }}" -o "$OUTPUT_TEMPLATE" 2>"$YTDLP_ERR_LOG" || YTDLP_EXIT_CODE=$?
          fi

          # Locate the actually downloaded file (match filename prefix)
          FINAL_FILE=$(ls -t ${FILE_PREFIX}.* 2>/dev/null | head -n 1)

          if [ -z "$FINAL_FILE" ] || [ $YTDLP_EXIT_CODE -ne 0 ]; then
            echo "❌ Error: yt-dlp download failed, no output file found"
            # Collect last meaningful error lines from stderr log
            YTDLP_LAST_ERR=$(tail -n 60 "$YTDLP_ERR_LOG" 2>/dev/null || true)
            # Fallback: also grep for common yt-dlp error keywords if tail is empty
            if [ -z "$YTDLP_LAST_ERR" ]; then
              YTDLP_LAST_ERR="Unknown error (no stderr captured)."
            fi
            echo "---RESULT_START---"
            echo "STATUS: FAILED"
            echo "REASON: yt-dlp download failed."
            echo "ERROR_LOG:"
            echo "$YTDLP_LAST_ERR"
            echo "---RESULT_END---"
            exit 1
          fi
          echo "FINAL_FILE=$FINAL_FILE" >> $GITHUB_ENV

      - name: 4. Dynamic plugin upload
        env:
          TOKEN: ${{ github.event.inputs.storage_provider == 'aliyun' && github.event.inputs.provider_token || secrets.ONEDRIVE_TOKEN }}
          PROVIDER: ${{ github.event.inputs.storage_provider }}
          PYTHONUNBUFFERED: "1"
        run: |
          chmod +x ./providers/${PROVIDER}.sh
          # ./providers/${PROVIDER}.sh "$FINAL_FILE" "$TOKEN"
          ./providers/${PROVIDER}.sh "$FINAL_FILE" || echo "Upload task timed out"

      - name: 5. Automatic GitHub space cleanup
        if: always()
        run: |
          echo "[*] Performing secure cleanup..."
          rm -f cookies.txt          # Delete cookie containing account credentials
          rm -f "${{ env.FINAL_FILE }}" 2>/dev/null || true  # Delete downloaded media file
          rm -rf ./*.part            # Delete possible download caches
          echo "✅ Data cleaned, no residue left."
